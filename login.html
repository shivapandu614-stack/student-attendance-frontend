<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Attendly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">A</div>
    <p class="eyebrow mb-1">STUDENT ATTENDANCE SYSTEM</p>
    <h1>Welcome back</h1>
    <p class="text-secondary mb-4">Sign in to continue to your workspace.</p>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="loginForm">
      <label class="form-label" for="username">Username</label>
      <input class="form-control form-control-lg mb-3" id="username" autocomplete="username" required>
      <label class="form-label" for="password">Password</label>
      <input class="form-control form-control-lg mb-4" id="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary btn-lg w-100" id="submitButton" type="submit">Sign in</button>
    </form>
    <div class="demo-hint mt-4"><strong>Demo access</strong><br>Admin: <code>admin / Admin123!</code><br>Teacher: <code>teacher@example.com / Teacher123!</code><br>Student: <code>STU-1001 / Student123!</code></div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
